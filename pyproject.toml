[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pexams"
version = "0.16.0"
description = "A Python library for generating and correcting exams using Playwright and OpenCV."
authors = [
    { name = "Oscar J. Pellicer-Valero" },
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=1.0.0",
    "opencv-python",
    "numpy",
    "pdf2image",
    "pydantic",
    "Markdown",
    "Faker",
    "Pillow",
    "playwright",
    "matplotlib",
    "pandas",
    "tabulate",
    "pymdown-extensions",
    "python-Levenshtein",
    "pypdf",
    "openpyxl",
    "pytest",
    "python-dotenv",
]

[project.optional-dependencies]
# Local TrOCR reader for the exam headers (--id-reader trocr, and the fallback without an API key).
trocr = ["torch", "torchvision", "transformers", "timm"]

[tool.pytest.ini_options]
markers = [
    "llm: tests that call a real LLM provider and may burn API credits",
]

[project.scripts]
pexams = "pexams.main:main"

[project.urls]
Homepage = "https://github.com/OscarPellicer/pexams"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["pexams*"]

[tool.setuptools.package-data]
pexams = ["*.css", "assets/sample_test.json", "assets/test_image.jpg", "assets/sample_test.md"]
